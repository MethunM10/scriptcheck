# cat > .github/workflows/secret-check.yml << 'EOF'
name: Secret check

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
          fi
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Scan for secrets
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: python scripts/scan_scripts.py "$BASE" "$HEAD"

      - name: Alert lead on failure
        if: failure()
        env:
          SLACK_URL: ${{ secrets.LEAD_SLACK_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_URL" ]; then
            echo "LEAD_SLACK_WEBHOOK is not set, skipping alert."
            exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Possible secret pushed to ${GITHUB_REPOSITORY} by @${ACTOR}. Details: ${RUN_URL}\"}" \
            "$SLACK_URL"
